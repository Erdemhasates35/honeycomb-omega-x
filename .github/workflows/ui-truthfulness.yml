name: UI truthfulness and build verification

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "scripts/verify-no-demo-data.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-truthfulness.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "scripts/verify-no-demo-data.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-truthfulness.yml"

permissions:
  contents: read

jobs:
  ui-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify no generated or fabricated telemetry
        run: npm run verify
      - name: Resolve exact dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  persist-lockfile:
    needs: ui-quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/honeycomb-package-json-integrity'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: honeycomb-package-lock
          path: .
      - name: Commit the exact lockfile tested by ui-quality
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "build: commit verified npm dependency lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
