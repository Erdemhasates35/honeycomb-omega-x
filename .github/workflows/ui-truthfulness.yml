name: UI truthfulness and build verification

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "scripts/verify-no-demo-data.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-truthfulness.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "scripts/verify-no-demo-data.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-truthfulness.yml"

permissions:
  contents: read

jobs:
  ui-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify no generated or fabricated telemetry
        run: npm run verify
      - name: Resolve exact dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
